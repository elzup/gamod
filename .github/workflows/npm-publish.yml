name: Publish @gamod/tic-tac-toe to npm

# npm 側の Trusted Publisher 設定はこのファイル名 (npm-publish.yml) と完全一致させる
on:
  push:
    tags: ["tic-tac-toe-v*"]
  workflow_dispatch:

permissions:
  id-token: write # OIDC 必須
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24" # OIDC は npm >= 11.5.1 が必要
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
      # registry-url を付けると書き込まれるダミーの _authToken が OIDC を skip させるので消す
      - name: Strip placeholder token so OIDC engages
        run: sed -i '/:_authToken=/d; /always-auth/d' "$NPM_CONFIG_USERCONFIG"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: npm publish --provenance
        working-directory: packages/tic-tac-toe
